<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="34" viewBox="0 0 1200 34" role="img" aria-label="Frutiger Aero divider">
  <defs>
    <linearGradient id="aero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#55d6ff" stop-opacity="0"/>
      <stop offset="18%" stop-color="#55d6ff" stop-opacity=".95"/>
      <stop offset="48%" stop-color="#82f3c6"/>
      <stop offset="72%" stop-color="#67d9ff"/>
      <stop offset="100%" stop-color="#55d6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="90" y="13" width="1020" height="8" rx="4"
        fill="url(#aero)" opacity=".32" filter="url(#glow)"/>
  <rect x="90" y="14" width="1020" height="5" rx="2.5"
        fill="url(#aero)"/>
  <rect x="90" y="14" width="1020" height="2" rx="1"
        fill="url(#shine)" opacity=".8"/>

  <circle cx="165" cy="10" r="4" fill="#b9f7ff" opacity=".75"/>
  <circle cx="1040" cy="24" r="3" fill="#b9ffd9" opacity=".7"/>
  <circle cx="1092" cy="8" r="2.5" fill="#d9fbff" opacity=".9"/>

  <path d="M600 4 L602.7 13.3 L612 16 L602.7 18.7 L600 28 L597.3 18.7 L588 16 L597.3 13.3 Z"
        fill="#ffffff" opacity=".92" filter="url(#glow)"/>
</svg>